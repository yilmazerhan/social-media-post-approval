# Local development infrastructure (ARCHITECTURE.md 12.2, "local" environment).
#
# Phase 0 runs the backing services here and the application from your IDE:
#   docker compose up -d
#   cd backend  && mvn spring-boot:run
#   cd frontend && npm run dev
#
# The application images themselves live behind the "app" profile, so the default `up` gives you
# infrastructure to develop against:
#   docker compose up -d                  # backing services only
#   docker compose --profile app up -d    # everything, built from the Dockerfiles

services:
  postgres:
    image: postgres:16-alpine
    container_name: ksa-postgres
    environment:
      POSTGRES_DB: ksa
      POSTGRES_USER: ksa
      POSTGRES_PASSWORD: ksa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksa -d ksa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ksa-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage. Console on http://localhost:9001 (minioadmin / minioadmin).
  minio:
    image: minio/minio:latest
    container_name: ksa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the three buckets from ARCHITECTURE.md 7.2 and exits.
  minio-init:
    image: minio/mc:latest
    container_name: ksa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/ksa-uploads;
      mc mb --ignore-existing local/ksa-media;
      mc mb --ignore-existing local/ksa-derivatives;
      mc mb --ignore-existing local/ksa-exports;
      mc ilm rule add --expire-days 1 local/ksa-uploads || true;
      "

  # Catches every outgoing mail so no test message reaches a real inbox.
  # Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ksa-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Antivirus scanning for uploaded attachments (ARCHITECTURE.md 7.3, 9.3).
  clamav:
    image: clamav/clamav:stable
    container_name: ksa-clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: ksa-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      KSA_DB_URL: jdbc:postgresql://postgres:5432/ksa
      KSA_REDIS_HOST: redis
      KSA_MAIL_HOST: mailpit
      KSA_STORAGE_ENDPOINT: http://minio:9000
      KSA_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
      - "8081:8081"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    container_name: ksa-frontend
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
