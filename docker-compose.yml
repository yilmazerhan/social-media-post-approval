########################################################################
# Production topology — DEPLOYMENT.md §2/§4. Four services: nginx (TLS,
# headers, the only thing published to the host), app and worker (same
# image, different command — DEPLOYMENT.md §2), and postgres (swap for a
# customer-managed server by pointing DATABASE_URL elsewhere and removing
# this service). See DEPLOYMENT.md for the full install walkthrough.
########################################################################
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ca-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ca-uploads:/app/data/uploads
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ca-uploads:/app/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    # The image's own HEALTHCHECK (from the Dockerfile) probes /api/health
    # over HTTP — meaningful for `app`, not for `worker`, which runs no
    # HTTP server at all. Disable it here rather than have Docker report
    # a background job consumer "unhealthy" forever.
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  ca-uploads:
  ca-pgdata:
