# Production expects every value from the environment; nothing sensitive is defaulted here.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      show-details: never

# The API contract is published to the frontend build, not to production traffic.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ksa:
  dev-seed:
    # Belt and braces: the seeder also refuses to run under this profile.
    enabled: false

logging:
  level:
    root: INFO
    com.kron.socialapproval: INFO

ksa:
  auth:
    local:
      enabled: ${KSA_AUTH_LOCAL_ENABLED:true}
    saml:
      enabled: ${KSA_AUTH_SAML_ENABLED:true}
