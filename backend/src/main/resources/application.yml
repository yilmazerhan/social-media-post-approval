spring:
  application:
    name: kron-social-approval
    version: 0.1.0-SNAPSHOT
  profiles:
    default: local
  datasource:
    url: ${KSA_DB_URL:jdbc:postgresql://localhost:5432/ksa}
    username: ${KSA_DB_USERNAME:ksa}
    password: ${KSA_DB_PASSWORD:ksa}
    hikari:
      maximum-pool-size: ${KSA_DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false          # views must not trigger lazy loads; queries belong in repositories
    hibernate:
      ddl-auto: validate         # the schema is Flyway's job alone (ARCHITECTURE.md 4.1)
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${KSA_REDIS_HOST:localhost}
      port: ${KSA_REDIS_PORT:6379}
      password: ${KSA_REDIS_PASSWORD:}
      timeout: 2s
  session:
    timeout: ${KSA_SESSION_IDLE_TIMEOUT:30m}
  mail:
    host: ${KSA_MAIL_HOST:localhost}
    port: ${KSA_MAIL_PORT:1025}
    username: ${KSA_MAIL_USERNAME:}
    password: ${KSA_MAIL_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${KSA_MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  thymeleaf:
    cache: true
  jackson:
    # Jackson 3 already writes java.time values as ISO-8601 strings; the wire format is UTC
    # ISO-8601 and the client renders in the user's zone (ARCHITECTURE.md 3.5).
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: false             # uploads go directly to object storage (ARCHITECTURE.md 7.3)

server:
  port: ${KSA_PORT:8080}
  servlet:
    session:
      cookie:
        name: KSA_SESSION
        http-only: true
        secure: ${KSA_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  shutdown: graceful

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${KSA_SWAGGER_ENABLED:false}

management:
  server:
    # Separate port: the ingress publishes 8080 only, so metrics and probes stay cluster-internal
    # without needing credentials on every Prometheus scrape (ARCHITECTURE.md 12.6).
    port: ${KSA_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # Readiness decides whether this replica receives traffic. Mail is deliberately excluded:
        # notifications go through the outbox, so an unreachable SMTP relay delays email but must
        # never take a healthy replica out of rotation (ARCHITECTURE.md 8.1, 12.6).
        readiness:
          include: db,redis,diskSpace
        liveness:
          include: livenessState
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: kron-social-approval

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}] [user=%X{userId:-}]"

ksa:
  base-url: ${KSA_BASE_URL:http://localhost:8080}
  auth:
    local:
      enabled: ${KSA_AUTH_LOCAL_ENABLED:true}
      password-min-length: 12
      lockout-threshold: 5
      lockout-duration: 15m
      reset-token-ttl: 30m
    saml:
      enabled: ${KSA_AUTH_SAML_ENABLED:false}
      registration-id: entra
      metadata-uri: ${KSA_SAML_METADATA_URI:}
      jit-mode: ${KSA_SAML_JIT_MODE:JIT_CREATE}
  session:
    idle-timeout: 30m
    absolute-timeout: 12h
  storage:
    provider: ${KSA_STORAGE_PROVIDER:filesystem}
    filesystem-root: ${KSA_STORAGE_ROOT:./var/storage}
    endpoint: ${KSA_STORAGE_ENDPOINT:http://localhost:9000}
    uploads-bucket: ksa-uploads
    media-bucket: ksa-media
    derivatives-bucket: ksa-derivatives
    max-image-bytes: 26214400
    max-video-bytes: 524288000
    max-attachments-per-post: 10
    presign-ttl: 15m
  workflow:
    default-sla-hours: 24
    default-mode: ANY_ONE
    expiry-days: 14
    sla-warning-threshold-percent: 80
  mail:
    from: ${KSA_MAIL_FROM:no-reply@kron.local}
    digest-time: "09:00"
    digest-timezone: Europe/Istanbul
    max-attempts: 5
  ai:
    enabled: ${KSA_AI_ENABLED:false}
    provider: ${KSA_AI_PROVIDER:noop}
    model: claude-sonnet-5
    hourly-request-cap: 100
