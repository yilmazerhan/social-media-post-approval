# Static delivery for the SPA. Routing, sessions and every security decision happen behind the
# ingress in the backend; this server only hands out files and never proxies to it, so the two
# tiers scale independently (ARCHITECTURE.md 12.3).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Hashed asset filenames are immutable; index.html must never be cached or a deploy would not
    # reach the browser.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths are application routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
